name: Build Android (APK + AAB)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [sea-merchant-2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Load game settings and copy the game into the app
        run: |
          set -a; . games/${{ matrix.game }}/game.env; set +a
          mkdir -p android/app/src/main/assets
          cp games/${{ matrix.game }}/index.html android/app/src/main/assets/index.html
          { echo "G_ID=$APP_ID"; echo "G_NAME=$APP_NAME"; echo "G_VC=$VERSION_CODE"; echo "G_VN=$VERSION_NAME"; } >> "$GITHUB_ENV"
      - name: Decode upload keystore (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK (signed release if keystore exists, otherwise debug)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then gradle assembleRelease -PappId="$G_ID" -PappName="$G_NAME" -PverCode="$G_VC" -PverName="$G_VN" --no-daemon; else gradle assembleDebug -PappId="$G_ID" -PappName="$G_NAME" -PverCode="$G_VC" -PverName="$G_VN" --no-daemon; fi
      - name: Build AAB (for Google Play)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease -PappId="$G_ID" -PappName="$G_NAME" -PverCode="$G_VC" -PverName="$G_VN" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-apk
          path: android/app/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Publish APK + AAB as a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/*/*.apk "${{ matrix.game }}.apk"
          cp android/app/build/outputs/bundle/release/*.aab "${{ matrix.game }}.aab"
          TAG="build-${{ matrix.game }}-${{ github.run_number }}"
          gh release create "$TAG" "${{ matrix.game }}.apk" "${{ matrix.game }}.aab" --title "$TAG" --notes "APK + AAB (commit ${GITHUB_SHA::7})"
