 if(c==0){const truth=Math.random()<.55;let j;if(truth){j=0;GOODS.forEach((_,x)=>SP.forEach((_,p)=>{if(p!==S.loc&&MU[p][x]>MU[j][0]&&false)j=p}));let best=-1,bp=-1;for(let p=0;p<SP.length;p++){if(p===S.loc)continue;const m=Math.max(...MU[p]);if(m>best){best=m;bp=p}}j=bp;S.tipLie=false}

  S.tipPort=j;qmark();toast(`🧔 ואסקו לוחש: "ב${LOCS[j]} המחירים גבוהים ממש. אל תגיד לאף אחד."`,'info');say(`ואסקו סיפר לך על ${LOCS[j]}. האם אפשר לסמוך עליו?`);speak(`ואסקו אומר: ב${LOCS[j]} המחירים גבוהים. אל תגיד לאף אחד.`,'wise')}
 else if(c==1){const price=Math.max(1,Math.round(S.prices[gi]*.9*repMul(d))),room=CAP-load(),can=Math.floor(S.cash/price);

   if(Math.random()<.3){S.prices[gi]=Math.round(S.prices[gi]*1.25);setTimeout(()=>toast(`😤 ואסקו נקם: מחיר ה${g.n} כאן עלה ב־25%.`,'warn'),1100)}}}

 else if(c==2){const r=pick(RIDDLES),ord=[0,1,2].sort(()=>Math.random()-.5);const a=await choose('🧩 חידה',`"${r[0]}"`,ord.map(i=>[r[1][i],'']));if(ord[a]===r[2]){toast('✅ תשובה נכונה! קיבלת את החלק בחינם.','good');sfx('fanfare');got=true;addRep(d,1,true)}else{toast('❌ תשובה שגויה. אפשר לקנות את החלק או לנסות חידה אחרת.','warn');sfx('err');again=true}}
 if(got){M.got.push(d);hud();sfx('treasure');toast(`📜 קיבלת חלק ${M.got.length} מתוך 3 של המפה הקרועה!`,'good');say(`חלק ${M.got.length}/3 של המפה הקרועה נאסף.`,'good');
  speak(M.got.length==3?'המפה שלמה! האי מסומן עכשיו על המפה.':`קיבלת חלק ${M.got.length} מתוך שלושה.`,'joy');
  if(M.got.length===3)await banner('🗺️ המפה שלמה!',1300);else{const nx=M.parts.find(p=>!M.got.includes(p));toast(`🧭 הרמז לחלק הבא: ${CLUES[nx]}.`,'info')}}}

 if(c==0){S.cash+=12000;for(let p=0;p<SP.length;p++)addRep(p,-1,true);M.how='all';toast('💰 לקחת הכול: +12,000. השמועה על התאוות שלך מתפשטת בכל הנמלים.','warn');say('לקחת את כל האוצר: +12,000.','good')}

 else{S.cash+=2000;for(let p=0;p<SP.length;p++)addRep(p,2,true);M.how='leave';toast('🌴 השארת את האוצר לתושבים: +2,000 והם יספרו עליך בכל הים.','good');say('השארת את האוצר לתושבי האי.','good')}

  if(c==0){if(S.cash<400){toast('אין מספיק כסף! השוחד עולה 400 מטבעות.','bad');sfx('err')}else{S.cash-=400;GOODS.forEach((_,x)=>{if(MU[d][x]<=.9)S.prices[x]=Math.round(S.prices[x]*.85)});addRep(d,-1);toast('💰 שילמת. מחירי הסחורות הזולות ירדו ב־15%.','warn');say('שילמת שוחד למושל.','bad')}}
  else{addRep(d,1);toast('🚫 סירבת לשוחד. המושל מכבד את זה.','good')}}
 else if(k==1){sfx('creak');speak('סוחר אחד תקוע בנמל עם ספינה פגומה. הוא מבקש הלוואה.','sad');

 else{sfx('bell');speak('מישהו מוכר סחורה נדירה, מבריקה וחשודה.','alarm');

  else if(c==1){if(S.cash<1000){toast('אין מספיק כסף! הפסלון עולה 1000 מטבעות.','bad');sfx('err')}else{S.cash-=1000;if(Math.random()<.35){S.cash+=4500;sfx('treasure');toast('🗿 אמיתי! מכרת לאספן ב־4,500.','good')}else{sfx('stab');toast('🗿 מזויף! הפסדת 1000 מטבעות.','bad')}}}}

async function arriveStory(d){ensureX();rivalTurn(d);
 if(S.owed&&S.owed.from!==d&&Math.random()<.6){const o=S.owed;S.owed=null;if(o.ok){S.cash+=o.amt;coins(400,200,8);toast(`🤲 הסוחר מצא אותך והחזיר ${fmt(o.amt)}!`,'good');say('ההלוואה הוחזרה עם רווח.','good')}else{toast('😞 הסוחר ששילמת לו נעלם. ההלוואה אבדה.','bad')}hud()}

 let t='👑 סוחר ים אגדי',why=me>200000;if(!why){t='⛵ סוחר מצליח';why=me>12000}

 ov(`<div class="mcard" style="text-align:center"><h2>🏁 סוף המסע</h2><p style="font-size:20px"><b>${win?'🏆 '+esc(win.name)+' ניצח!':'🤝 תיקו!'}</b></p><table class="tbl" style="width:100%">${row(a)}${row(b)}</table><div class="mrow" style="margin-top:12px"><button class="mb2 play" onclick="open2P()">🔁 משחק חוזר</button><button class="mb2" onclick="mainMenu(false)">☰ תפריט</button></div></div>`,'dim')}

var G2COL=[{hull:'#7a4524',hull2:'#4a2a14',trim:'#f0c75e',flag:'#d93a3a',coat:'#b8322a'},{hull:'#2b4a7a',hull2:'#18284a',trim:'#7fdcf0',flag:'#2a7fd9',coat:'#2a6fc9',sail:'#f2f8ff',sail2:'#c4d8ee'}];
function g2mini(p,i,sc){return `<g transform="scale(${sc})">${ship(p.lv||0,Object.assign({},G2COL[i]))}</g>`}
function g2chip(i){const p=G2.p[i],act=G2.cur===i,w=wealthOf(p);return `<span class="g2c" style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 4px;border-radius:14px;font-size:11px;white-space:nowrap;color:#1b2a3a;background:${act?'#fff3c4':'rgba(255,255,255,.82)'};box-shadow:${act?'0 0 0 2px #f0b429':'0 1px 3px #0005'};"><svg width="40" height="30" viewBox="-95 -150 190 175" style="overflow:visible">${g2mini(p,i,1)}</svg><span style="line-height:1.1;text-align:right"><b>${esc(p.name)}</b>${act?' ◀':''}<br><small>${fmt(w)} ₪ · ${p.over?'סיים':'יום '+Math.min(p.day,DAYS)}</small></span></span>`}
{const _h=hud;hud=function(){_h();if(G2&&G2.on&&S){const hd=$('hud');if(hd){let bar=$('g2duo');if(!bar){bar=document.createElement('div');bar.id='g2duo';bar.style.cssText='position:absolute;left:8px;bottom:8px;display:flex;gap:6px;z-index:6;pointer-events:none';hd.parentElement.appendChild(bar)}bar.innerHTML=g2chip(0)+g2chip(1)}const rv=$('g2rv');if(rv){const o=G2.p[1-G2.cur];rv.innerHTML=(o&&!o.over&&o.loc===S.loc&&!S.trip)?`<g transform="translate(660,268) scale(.5)" opacity=".95">${ship(o.lv||0,Object.assign({},G2COL[1-G2.cur]))}</g><text x="660" y="290" font-size="11" font-weight="800" text-anchor="middle" fill="#fff" stroke="#1b3a6b" stroke-width="3" paint-order="stroke">${esc(o.name)}</text>`:''}const m=$('msf');if(m){m.innerHTML=`<g class="mb"><g transform="translate(0,6) scale(.3)">${ship(S.lv||0,Object.assign({},G2COL[G2.cur]))}</g></g>`}}}}
{const _rh2=rivalHtml;rivalHtml=function(){if(G2&&G2.on){const i=1-G2.cur,o=G2.p[i];if(!o||o.over)return'';const p=SP[o.loc];return `<g transform="translate(${p[2]+20},${p[3]-6}) scale(.3)"><g class="mb">${ship(o.lv||0,Object.assign({},G2COL[i]))}</g></g><text x="${p[2]+20}" y="${p[3]-26}" font-size="9" text-anchor="middle" font-weight="800" fill="#fff" stroke="#1b3a6b" stroke-width="2.6" paint-order="stroke">${esc(o.name)}</text>`}return _rh2()}}

var GUNS=[['תותחים קלים',0],['תותחי ברונזה',2500],['תותחים כבדים',7000],['קולברינות',16000],['תותחי ענק',32000]];
function gunLv(){return Math.max(0,Math.min(4,(S&&S.gun)|0))}
function gunWin(){return .06*gunLv()+.04*((S&&S.lv)|0)}
function gunEsc(){return .04*gunLv()+.03*((S&&S.lv)|0)}
function gunDet(){return Math.max(.45,1-.07*gunLv()-.04*((S&&S.lv)|0))}
function gunCard(){const L=gunLv(),N=GUNS[L+1],base=Math.min(97,Math.round((.35+gunWin())*100));return `<div class="card" style="padding:4px 10px"><div class="row"><span style="font-size:12px"><b>💣 ${GUNS[L][0]}</b> <span class="mut" style="font-size:10.5px">→ ${N?N[0]:''}</span> ${'💥'.repeat(L+1)}<br><span class="mut" style="font-size:10.5px">קרב ~${base}% · בריחה ${Math.round((.45+gunEsc())*100)}% · התקפות −${Math.round((1-gunDet())*100)}%</span></span>${N?`<button class="a" style="padding:3px 8px" ${S.busy?'disabled':''} onclick="upgradeGun()" title="${N[0]}">🔫 ${fmt(N[1])}</button>`:'<span class="good">🏆 מקסימלי</span>'}</div></div>`}
function upgradeGun(){if(S.busy)return;const L=gunLv(),N=GUNS[L+1];if(!N)return;if(S.cash<N[1]){say(`צריך ${fmt(N[1])} כדי לשדרג חימוש.`,'bad');return draw()}S.cash-=N[1];S.gun=L+1;sfx('upgrade');sfx('cannon',.2);say(`🔫 התקנת ${N[0]}! סיכויי הקרב מול שודדים השתפרו.`,'good');hud();draw()}
{const _y=yard;yard=function(){return _y()+gunCard()}}

// ===== חוזים עם נמלים =====
function ctRng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ctEnsure(){if(!S.ct)S.ct={act:[],done:0,failed:0}}
function ctEpoch(){return Math.floor((S.day-1)/4)}
function ctBoard(port){const ep=ctEpoch(),rnd=ctRng(port*7919+ep*104729+17),out=[];const used=new Set();
 for(let i=0;i<3;i++){let t;do{t=Math.floor(rnd()*SP.length)}while(t===port||used.has(t));used.add(t);
  const gi=Math.floor(rnd()*5),V=(500+ep*450)*(.7+rnd()*.9),q=Math.max(5,Math.min(Math.round(CAP*.4/5)*5,(x=>x>=10?Math.round(x/5)*5:Math.max(1,Math.round(x)))(V/Math.max(1,bp(gi,t))))),d=Math.max(1,Math.round(kmBetween(port,t)/430)),
   dl=ep*4+1+d*2+5+Math.floor(rnd()*4),risk=(GOODS[gi].p||0),mult=1.25+rnd()*.35,rew=Math.round((q*bp(gi,t)*mult+300)/10)*10,dep=Math.max(50,Math.min(500,Math.round(rew*.05/10)*10));
  out.push({id:port+':'+ep+':'+i,f:port,t,gi,q,dl,rew,dep})}return out}
function ctTaken(id){return(G2&&G2.on&&G2.taken&&G2.taken[id]!=null&&G2.taken[id]!==G2.cur)?G2.p[G2.taken[id]].name:null}
function ctMax(){return S.lv>=2?3:2}
function ctAccept(id){if(S.busy)return;ctEnsure();const o=ctBoard(S.loc).find(x=>x.id===id);if(!o)return;
 if(S.ct.act.some(a=>a.id===id))return;if(ctTaken(id)){toast('החוזה כבר נלקח על ידי היריב.','warn');return draw()}
 if(S.ct.act.length>=ctMax()){toast(`אפשר לשאת עד ${ctMax()} חוזים פעילים.`,'warn');return}
 if(S.cash<o.dep){toast(`אין מספיק כסף לפיקדון: ${fmt(o.dep)}.`,'bad');sfx('err');return}
 S.cash-=o.dep;S.ct.act.push(o);if(G2&&G2.on){G2.taken=G2.taken||{};G2.taken[id]=G2.cur}
 sfx('jingle');toast(`📋 חתמת על חוזה ל${LOCS[o.t]}. פיקדון ${fmt(o.dep)}.`,'good');say(`חתמת על חוזה: ${o.q} טון ${GOODS[o.gi].n} ל${LOCS[o.t]} עד יום ${o.dl}.`,'good');hud();qmark();draw()}
function ctDeliver(id){if(S.busy)return;ctEnsure();const i=S.ct.act.findIndex(a=>a.id===id);if(i<0)return;const c=S.ct.act[i],g=GOODS[c.gi];
 if(S.loc!==c.t)return;if(S.cargo[g.k]<c.q){say(`חסר מטען: צריך ${c.q} טון ${g.n}.`,'bad');return draw()}
 S.cargo[g.k]-=c.q;const late=S.day>c.dl;if(late){S.ct.act.splice(i,1);S.ct.failed++;addRep(c.f,-1);toast('⏰ איחרת! החוזה בוטל והפיקדון אבד.','bad');hud();qmark();return draw()}
 S.cash+=c.rew+c.dep;S.ct.act.splice(i,1);S.ct.done++;addRep(c.f,1,true);addRep(c.t,1);sfx('jingle');sfx('cash',.4);coins&&0;
 toast(`✅ החוזה הושלם! קיבלת ${fmt(c.rew)} + החזר פיקדון.`,'good');say(`החוזה הושלם: ${fmt(c.rew)}.`,'good');speak('החוזה הושלם. הלקוח מרוצה.','joy');hud();qmark();draw()}
function ctCheck(){if(!S||!S.ct)return;const keep=[];S.ct.act.forEach(c=>{if(S.day>c.dl+0){S.ct.failed++;addRep(c.f,-1,true);toast(`⏰ החוזה ל${LOCS[c.t]} פג. הפיקדון אבד.`,'bad');say(`החוזה ל${LOCS[c.t]} פג.`,'bad')}else keep.push(c)});S.ct.act=keep}
function contractCard(){ctEnsure();ctCheck();const act=S.ct.act,bd=ctBoard(S.loc);
 const ar=act.map(c=>{const g=GOODS[c.gi],have=S.cargo[g.k],left=c.dl-S.day,at=S.loc===c.t,ok=have>=c.q;return `<div class="row" style="padding:2px 0;font-size:12px"><span>${g.e} <b>${c.q}</b> טון ${g.n} → <b>${EM[c.t]} ${LOCS[c.t]}</b><br><span class="mut">עד יום ${c.dl} (${left} ימים) · במחסן ${have}/${c.q} · פרס ${fmt(c.rew)}</span></span>${at?`<button class="s" ${ok&&!S.busy?'':'disabled'} onclick="ctDeliver('${c.id}')">📦 מסור</button>`:''}</div>`}).join('');
 const br=bd.filter(o=>!act.some(a=>a.id===o.id)).map(o=>{const g=GOODS[o.gi],tk=ctTaken(o.id);return `<div class="row" style="padding:1px 0;font-size:11.5px;${tk?'opacity:.55':''}"><span>${g.e} ${o.q}ט׳ → ${EM[o.t]} ${LOCS[o.t]} · יום ${o.dl} · <b>${fmt(o.rew)}</b></span>${tk?`<span class="mut">נלקח: ${esc(tk)}</span>`:`<button class="a" style="padding:2px 8px" ${S.busy?'disabled':''} onclick="ctAccept('${o.id}')">✍️ ${fmt(o.dep)}</button>`}</div>`}).join('');
 return `<div class="card" style="border-color:#e0a21b;padding:6px 10px"><b>📋 חוזים (${act.length}/${ctMax()})</b> <span class="mut" style="font-size:11px">· הושלמו ${S.ct.done}</span>${ar||'<div class="mut" style="font-size:12px">אין חוזים פעילים.</div>'}<div style="border-top:1px dashed #cdbb8c;margin-top:3px;padding-top:2px"><span class="mut" style="font-size:11px">לוח החוזים של ${LOCS[S.loc]} · כפתור = פיקדון</span>${br||'<div class="mut" style="font-size:12px">אין הצעות.</div>'}</div></div>`}
questCard=function(){return contractCard()};
{const _nq=newQuest;newQuest=function(){S.quest=null}}
{const _d=draw;draw=function(){try{ctCheck()}catch(e){}_d()}}
{const _qm=qmark;qmark=function(){_qm();const e=$('qs');if(e&&S&&S.ct){e.insertAdjacentHTML('beforeend',S.ct.act.map(c=>`<g class="mb"><text x="${SP[c.t][2]+16}" y="${SP[c.t][3]-14}" font-size="22">⭐</text></g>`).join(''))}}}
</script>
