const AU={mv:.55,sv:.9,vv:1,voice:true,music:true,sound:true,vname:'',ctx:null,bus:{},amb:null,mode:'',step:0,loop:0,nt:0,ducks:0,cur:''};

function A(){if(AU.ctx)return AU.ctx;
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;const c=new C();AU.ctx=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=20;comp.ratio.value=6;comp.attack.value=.004;comp.release.value=.25;
  const mg=c.createGain();mg.gain.value=.85;comp.connect(mg);mg.connect(c.destination);
  
  const mk=(n,v)=>{const g=c.createGain();g.gain.value=v;g.connect(comp);AU.bus[n]=g};
  mk('music',AU.music?AU.mv:0);mk('sfx',AU.sound?AU.sv:0);mk('amb',AU.sound?AU.sv*.6:0);
  // simple reverb: filtered feedback delay
  const rin=c.createGain(),dl=c.createDelay(1),fb=c.createGain(),lp=c.createBiquadFilter(),ro=c.createGain();
  dl.delayTime.value=.19;fb.gain.value=.38;lp.type='lowpass';lp.frequency.value=2200;ro.gain.value=.5;
  rin.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(ro);ro.connect(comp);AU.rev=rin;
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=nb;
  return c}catch(e){AU.ctx=null;return null}}
function applyVol(){const c=AU.ctx;if(!c)return;const t=c.currentTime;

function mstep(M,i,t,sd){const sc=SC[M.sc],L=M.mel.length,k=i%L,lp=AU.loop,v=lp%4,CH=[0,3,4,0][v];

 if(d!=null){if(v==2)d+=2;if(Math.random()<.08)d+=Math.random()<.5?1:-1}
 else if(v==1&&k%2==0){const p=M.mel[(k+L-2)%L];if(p!=null&&Math.random()<.3)d=p+1}
 if(d!=null)lead(M.n,mf(M.root+12+degS(sc,d)),t,sd);
 const b=M.bass[k];if(b!=null){const fb=mf(M.root-12+degS(sc,b+CH));osc(fb,t,sd*3.2,{type:'triangle',v:.2,bus:'music'});osc(fb,t,sd*3,{v:.2,bus:'music'})}
 if(M.pad&&k==0){const r=M.root+degS(sc,CH);[0,7].forEach(x=>osc(mf(r+x),t,sd*L*.95,{type:'sawtooth',v:.022,lp:650,a:sd*3,bus:'music',rev:.4,det:x?4:-4}))}
 const c=M.pc[k%M.pc.length];if(c=='D')perc(t,M.big);else if(c=='T')perc2(t,1);else if(c=='k')perc2(t,.5)}

const MOOD={calm:[.97,1],alarm:[1.1,1.07],dread:[.86,.78],joy:[1.03,1.17],sad:[.9,.86],urgent:[1.17,1.02],wise:[.94,.9]};
const isNat=v=>!!v&&/natural|neural|online|enhanced|premium|siri/i.test(v.name);
function hebVoices(){try{return speechSynthesis.getVoices().filter(v=>/^(he|iw)/i.test(v.lang))}catch(e){return[]}}
function pickVoice(){const vs=hebVoices();if(!vs.length)return null;
 if(AU.vname){const m=vs.find(v=>v.name===AU.vname);if(m)return m}
 const sc=v=>(/natural|neural|online/i.test(v.name)?100:0)+(/enhanced|premium|siri/i.test(v.name)?70:0)+(/google/i.test(v.name)?40:0)+(v.localService?0:10)+(/hila|avri|carmit|asaf/i.test(v.name)?15:0);
 return vs.slice().sort((a,b)=>sc(b)-sc(a))[0]}
function speak(t,mood='calm'){return new Promise(res=>{const sy=window.speechSynthesis;if(!AU.voice||!sy||!A())return res();const v=pickVoice();if(!v)return res();
 const parts=(t.match(/[^.!?]+[.!?]*/g)||[t]).map(s=>s.trim()).filter(Boolean),[r0,p0]=MOOD[mood]||MOOD.calm,nat=isNat(v),rt=nat?1+(r0-1)*.4:1+(r0-1)*.7,pt=nat?1:1+(p0-1)*.45;
 let done=false,ended=0;const fin=()=>{if(done)return;done=true;duck(false);res()};
 try{sy.cancel()}catch(e){}
 duck(true);
